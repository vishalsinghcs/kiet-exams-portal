name: Sync Supabase to RDS

# Allows you to trigger this workflow manually from the Actions tab in GitHub
on:
  workflow_dispatch:

jobs:
  sync:
    name: Transfer Data (Supabase -> RDS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Open Firewall Pinhole for GitHub Actions
        run: |
          echo "Finding RDS Security Group ID..."
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kiet-rds-sg --query "SecurityGroups[0].GroupId" --output text)
          echo "SG_ID=$SG_ID" >> $GITHUB_ENV

          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV

          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 5432 --cidr $RUNNER_IP/32 > /dev/null

      - name: Sync Supabase Data to RDS
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RDS_DB_URL: ${{ secrets.RDS_DB_URL }}
        run: |
          chmod +x .github/scripts/db_transfer.sh
          ./.github/scripts/db_transfer.sh

      - name: Close Firewall Pinhole
        if: always() # Ensure it runs even if the sync fails
        run: |
          if [ -n "$RUNNER_IP" ] && [ -n "$SG_ID" ]; then
            aws ec2 revoke-security-group-ingress --group-id $SG_ID --protocol tcp --port 5432 --cidr $RUNNER_IP/32 > /dev/null || true
          fi

name: AWS Exam Day Startup

# IMPORTANT: Edit this cron expression to schedule the startup for an exam day.
# Example: '30 2 15 8 *' means 08:00 AM IST on August 15th.
# The time is in UTC. (IST is UTC + 5:30)
on:
  schedule:
    - cron: "30 2 31 12 *" # Placeholder - update before exam
  workflow_dispatch: # Allows manual trigger

jobs:
  startup:
    name: Start RDS, Sync Data, Start ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Restore RDS Database from Snapshot
        run: |
          echo "Finding latest snapshot for kiet-exams-db..."
          LATEST_SNAPSHOT=$(aws rds describe-db-snapshots --db-instance-identifier kiet-exams-db --query 'reverse(sort_by(DBSnapshots, &SnapshotCreateTime))[0].DBSnapshotIdentifier' --output text)

          if [ "$LATEST_SNAPSHOT" == "None" ] || [ -z "$LATEST_SNAPSHOT" ]; then
            echo "No snapshot found! Cannot restore."
            exit 1
          fi

          echo "Finding RDS Security Group ID..."
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kiet-rds-sg --query "SecurityGroups[0].GroupId" --output text)
          echo "SG_ID=$SG_ID" >> $GITHUB_ENV

          echo "Restoring RDS instance from snapshot $LATEST_SNAPSHOT..."
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier kiet-exams-db \
            --db-snapshot-identifier $LATEST_SNAPSHOT \
            --db-instance-class db.t4g.micro \
            --vpc-security-group-ids $SG_ID \
            --publicly-accessible

      - name: Wait for RDS to be available
        run: |
          echo "Waiting for RDS instance to become available..."
          aws rds wait db-instance-available --db-instance-identifier kiet-exams-db

      - name: Open Firewall Pinhole for GitHub Actions
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "Authorizing $RUNNER_IP/32 on Security Group $SG_ID..."
          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 5432 --cidr $RUNNER_IP/32

      - name: Sync Supabase Data to RDS
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RDS_DB_URL: ${{ secrets.RDS_DB_URL }}
        run: |
          chmod +x .github/scripts/db_transfer.sh
          ./.github/scripts/db_transfer.sh

      - name: Close Firewall Pinhole
        if: always() # Ensure it runs even if the sync fails
        run: |
          if [ -n "$RUNNER_IP" ] && [ -n "$SG_ID" ]; then
            echo "Revoking $RUNNER_IP/32 from Security Group $SG_ID..."
            aws ec2 revoke-security-group-ingress --group-id $SG_ID --protocol tcp --port 5432 --cidr $RUNNER_IP/32 || true
          fi

      - name: Start ECS Backend Tasks
        run: |
          echo "Scaling ECS service to 2 tasks..."
          aws ecs update-service --cluster kiet-exams-cluster --service kiet-backend-service --desired-count 2 --region ap-south-1
          echo "AWS Environment is now fully started and updated!"

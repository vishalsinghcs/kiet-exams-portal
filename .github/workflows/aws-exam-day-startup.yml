name: AWS Exam Day Startup

# IMPORTANT: Edit this cron expression to schedule the startup for an exam day.
# Example: '30 2 15 8 *' means 08:00 AM IST on August 15th.
# The time is in UTC. (IST is UTC + 5:30)
on:
#  schedule:
#    - cron: "30 2 31 12 *" # Placeholder - update before exam
  workflow_dispatch: # Allows manual trigger

jobs:
  start-rds:
    name: Start RDS
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Restore RDS Database from Snapshot
        run: |
          echo "Finding latest snapshot for kiet-exams-db..."
          LATEST_SNAPSHOT=$(aws rds describe-db-snapshots --db-instance-identifier kiet-exams-db --query 'reverse(sort_by(DBSnapshots, &SnapshotCreateTime))[0].DBSnapshotIdentifier' --output text)

          if [ "$LATEST_SNAPSHOT" == "None" ] || [ -z "$LATEST_SNAPSHOT" ]; then
            echo "No snapshot found! Cannot restore."
            exit 1
          fi

          echo "Finding RDS Security Group ID..."
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kiet-rds-sg --query "SecurityGroups[0].GroupId" --output text)
          echo "SG_ID=$SG_ID" >> $GITHUB_ENV

          echo "Restoring RDS instance from snapshot $LATEST_SNAPSHOT..."
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier kiet-exams-db \
            --db-snapshot-identifier $LATEST_SNAPSHOT \
            --db-instance-class db.t4g.micro \
            --vpc-security-group-ids $SG_ID \
            --publicly-accessible > /dev/null

      - name: Wait for RDS to be available
        run: |
          echo "Waiting for RDS instance to become available..."
          aws rds wait db-instance-available --db-instance-identifier kiet-exams-db

  start-elasticache:
    name: Start ElastiCache
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Restore ElastiCache
        run: |
          echo "Finding latest snapshot for kiet-redis..."
          LATEST_SNAPSHOT=$(aws elasticache describe-snapshots --cache-cluster-id kiet-redis --query 'reverse(sort_by(Snapshots, &SnapshotCreateTime))[0].SnapshotName' --output text)
          
          if [ "$LATEST_SNAPSHOT" == "None" ] || [ -z "$LATEST_SNAPSHOT" ]; then
            echo "No snapshot found! Cannot restore."
            exit 1
          fi

          echo "Finding ElastiCache Security Group ID..."
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kiet-redis-sg --query "SecurityGroups[0].GroupId" --output text)
          
          echo "Restoring ElastiCache instance from snapshot $LATEST_SNAPSHOT..."
          aws elasticache create-cache-cluster \
            --cache-cluster-id kiet-redis \
            --snapshot-name $LATEST_SNAPSHOT \
            --cache-node-type cache.t3.micro \
            --num-cache-nodes 1 \
            --engine valkey \
            --security-group-ids $SG_ID > /dev/null

      - name: Wait for ElastiCache
        run: |
          echo "Waiting for ElastiCache instance to become available..."
          aws elasticache wait cache-cluster-available --cache-cluster-id kiet-redis

  start-ecs:
    name: Start ECS
    needs: [start-rds, start-elasticache]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Start ECS Backend Tasks
        run: |
          echo "Scaling ECS service to 2 tasks..."
          aws ecs update-service --cluster kiet-exams-cluster --service kiet-backend-service --desired-count 2 --region ap-south-1 > /dev/null
        
      - name: Wait for ECS to become stable
        run : |
          echo "Waiting for ECS Tasks to become healthy and stable..."
          aws ecs wait services-stable --cluster kiet-exams-cluster --services kiet-backend-service --region ap-south-1
          
          echo "AWS Environment is now fully started and updated!"

name: Shift to AWS

on:
  workflow_dispatch:

jobs:
  prepare-shift:
    name: Enable Render Maintenance & Update S3
    runs-on: ubuntu-latest
    steps:
      - name: Enable Render Maintenance
        run: |
          curl -X POST ${{ secrets.RENDER_BACKEND_URL }}/admin/maintenance-mode \
               -H "X-API-Key: ${{ secrets.MAINTENANCE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d '{"enabled": true}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update S3 Frontend Config
        run: |
          echo "window.APP_CONFIG = { API_BASE_URL: '${{ secrets.AWS_CLOUDFRONT_BACKEND_URL }}' };" > env.js
          aws s3 cp env.js s3://${{ secrets.FRONTEND_S3_BUCKET }}/env.js \
              --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/env.js"

  start-rds:
    name: Start RDS
    needs: prepare-shift
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Restore RDS
        run: |
          LATEST_SNAPSHOT=$(aws rds describe-db-snapshots --db-instance-identifier kiet-exams-db --query 'reverse(sort_by(DBSnapshots, &SnapshotCreateTime))[0].DBSnapshotIdentifier' --output text)
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kiet-rds-sg --query "SecurityGroups[0].GroupId" --output text)
          
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier kiet-exams-db \
            --db-snapshot-identifier $LATEST_SNAPSHOT \
            --db-instance-class db.t4g.micro \
            --vpc-security-group-ids $SG_ID \
            --publicly-accessible > /dev/null

      - name: Wait for RDS
        run: aws rds wait db-instance-available --db-instance-identifier kiet-exams-db

  start-elasticache:
    name: Start ElastiCache
    needs: prepare-shift
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Restore ElastiCache
        run: |
          LATEST_SNAPSHOT=$(aws elasticache describe-snapshots --cache-cluster-id kiet-redis --query 'reverse(sort_by(Snapshots, &SnapshotCreateTime))[0].SnapshotName' --output text)
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kiet-redis-sg --query "SecurityGroups[0].GroupId" --output text)
          
          aws elasticache create-cache-cluster \
            --cache-cluster-id kiet-redis \
            --snapshot-name $LATEST_SNAPSHOT \
            --cache-node-type cache.t3.micro \
            --num-cache-nodes 1 \
            --engine valkey \
            --security-group-ids $SG_ID > /dev/null

      - name: Wait for ElastiCache
        run: aws elasticache wait cache-cluster-available --cache-cluster-id kiet-redis

  start-ecs:
    name: Start ECS
    needs: [start-rds, start-elasticache]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Start ECS Tasks
        run: aws ecs update-service --cluster kiet-exams-cluster --service kiet-backend-service --desired-count 2 --region ap-south-1 > /dev/null
        
      - name: Wait for ECS
        run: aws ecs wait services-stable --cluster kiet-exams-cluster --services kiet-backend-service --region ap-south-1

  sync-db:
    name: Sync Supabase -> RDS
    needs: start-rds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Open Firewall Pinhole
        run: |
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=kiet-rds-sg --query "SecurityGroups[0].GroupId" --output text)
          echo "SG_ID=$SG_ID" >> $GITHUB_ENV
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 5432 --cidr $RUNNER_IP/32 > /dev/null

      - name: Run DB Sync
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RDS_DB_URL: ${{ secrets.RDS_DB_URL }}
        run: |
          chmod +x .github/scripts/db_transfer.sh
          ./.github/scripts/db_transfer.sh

      - name: Close Firewall Pinhole
        if: always()
        run: |
          if [ -n "$RUNNER_IP" ] && [ -n "$SG_ID" ]; then
            aws ec2 revoke-security-group-ingress --group-id $SG_ID --protocol tcp --port 5432 --cidr $RUNNER_IP/32 > /dev/null || true
          fi

  finalize-shift:
    name: Disable AWS Maintenance
    needs: [sync-db, start-ecs]
    runs-on: ubuntu-latest
    steps:
      - name: Disable AWS Maintenance
        run: |
          curl -X POST ${{ secrets.AWS_CLOUDFRONT_BACKEND_URL }}/admin/maintenance-mode \
               -H "X-API-Key: ${{ secrets.MAINTENANCE_API_KEY }}" \
               -H "Content-Type: application/json" \
               -d '{"enabled": false}'
